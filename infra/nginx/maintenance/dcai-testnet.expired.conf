# ============================================================================
# TEMP MAINTENANCE MODE — every route + every method returns the blank
# "server expired" page with HTTP 500.
#
# REVERT to the full working site:
#   cp -a /etc/nginx/sites-available/dcai-testnet.preexpired.20260801T100919Z \
#         /etc/nginx/sites-available/dcai-testnet && nginx -t && systemctl reload nginx
# ============================================================================

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name explorer.dcai.ai _;
  return 308 https://explorer.dcai.ai$request_uri;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name explorer.dcai.ai _;

  ssl_certificate /etc/letsencrypt/live/explorer.dcai.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/explorer.dcai.ai/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  root /var/www/html/maintenance;

  # ACME webroot kept open so certbot can still renew while masked
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    default_type "text/plain";
  }

  location = /expired.html { internal; }
  location / { return 500; }
  error_page 500 /expired.html;
}
